<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI Hand Core | Visión Artificial</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #050811;
      --panel: #0a1122;
      --cyan: #00f0ff;
      --magenta: #ff0055;
      --border: rgba(0, 240, 255, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: #e2e8f0;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.05) 0%, transparent 60%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      overflow-x: hidden;
    }

    /* Encabezado */
    header {
      position: absolute;
      top: 25px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    header h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.5rem;
      color: var(--cyan);
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    header p {
      font-size: 0.85rem;
      color: #64748b;
    }

    /* Contenedor Principal */
    .viewport-container {
      position: relative;
      width: 640px;
      height: 480px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Esquinas decorativas Cyberpunk/IA */
    .corner {
      position: absolute;
      width: 16px;
      height: 16px;
      border: 2px solid var(--cyan);
      z-index: 10;
    }
    .top-left { top: 8px; left: 8px; border-right: none; border-bottom: none; }
    .top-right { top: 8px; right: 8px; border-left: none; border-bottom: none; }
    .bottom-left { bottom: 8px; left: 8px; border-right: none; border-top: none; }
    .bottom-right { bottom: 8px; right: 8px; border-left: none; border-top: none; }

    /* Stream de Video */
    #videoFeed {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    /* Botón Principal */
    .btn-scan {
      position: relative;
      padding: 18px 36px;
      font-family: 'Orbitron', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid var(--cyan);
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
    }

    .btn-scan:hover {
      background: var(--cyan);
      color: var(--bg);
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.8);
      transform: scale(1.05);
    }

    /* Barra de estado inferior */
    .status-bar {
      position: absolute;
      bottom: 12px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #00f0ff88;
      font-family: 'Orbitron', sans-serif;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>AI Hand Detection</h1>
    <p>Neural Vision Engine v1.0</p>
  </header>

  <div class="viewport-container">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <button id="scanBtn" class="btn-scan" onclick="startScan()">Iniciar Escaneo</button>
    <img id="videoFeed" alt="Stream de Cámara" />

    <div class="status-bar">
      <span id="statusText">SYSTEM: READY</span>
      <span>MODEL: MEDIAPIPE_HANDS</span>
    </div>
  </div>

  <script>
    function startScan() {
      const btn = document.getElementById('scanBtn');
      const video = document.getElementById('videoFeed');
      const status = document.getElementById('statusText');

      btn.style.display = 'none';
      video.style.display = 'block';
      video.src = 'http://localhost:5000/video_feed';
      
      status.innerText = 'SYSTEM: PROCESSING_STREAM';
      status.style.color = '#00f0ff';
    }
  </script>

</body>
</html>
